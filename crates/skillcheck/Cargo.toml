[package]
name = "skillcheck"
version = "0.1.0"
description = "Lints raea skills: format, upstream drift, and opinion creep."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
cucumber = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The Gherkin behaviour tests in /features run through this harness.
[[test]]
name = "bdd"
harness = false
